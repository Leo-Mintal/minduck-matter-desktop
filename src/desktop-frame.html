<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minduck Matter</title>
    <link rel="stylesheet" href="desktop-frame.css" />
    <script src="desktop-frame.js" defer></script>
  </head>
  <body>
    <header class="titlebar">
      <nav class="page-navigation" aria-label="主页面导航">
        <button id="matter-back" class="icon-button" type="button" title="后退" aria-label="主页面后退" disabled>
          <span class="icon back-icon" aria-hidden="true"></span>
        </button>
        <button id="matter-forward" class="icon-button" type="button" title="前进" aria-label="主页面前进" disabled>
          <span class="icon forward-icon" aria-hidden="true"></span>
        </button>
        <button id="matter-reload" class="icon-button" type="button" title="刷新" aria-label="刷新主页面" disabled>
          <span class="icon reload-icon" aria-hidden="true"></span>
        </button>
      </nav>
      <button id="browser-toggle" class="icon-button" type="button" title="展开浏览器" aria-label="展开浏览器" aria-expanded="false">
        <span class="icon sidebar-icon" aria-hidden="true"></span>
      </button>
    </header>
    <nav class="rail" aria-label="客户端导航">
      <div class="rail-tools" role="group" aria-label="客户端工具">
        <button id="check-update" class="icon-button" type="button" title="检查更新" aria-label="检查更新">
          <span class="icon update-icon" aria-hidden="true"></span>
          <img class="available-icon" src="assets/update-available.svg" alt="" aria-hidden="true" />
          <span id="update-progress" class="update-progress" role="progressbar" aria-label="下载更新" aria-valuemin="0" aria-valuemax="100" hidden></span>
        </button>
        <button id="companion-settings" class="icon-button" type="button" title="桌宠设置" aria-label="桌宠设置">
          <span class="icon settings-icon" aria-hidden="true"></span>
        </button>
      </div>
    </nav>
    <span id="update-status" class="sr-only" role="status" aria-live="polite"></span>
  </body>
</html>
